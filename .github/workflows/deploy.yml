# Deploy PCT Mission Control to GitHub Pages
# Triggers on push to master branch

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: pct-hike-viz/package-lock.json

      - name: Install dependencies
        working-directory: pct-hike-viz
        run: npm ci

      - name: Configure env
        working-directory: pct-hike-viz
        run: cp .env.example .env

      - name: Verify canonical terrain and generated bundles
        run: |
          node scripts/validate_canonical_terrain.mjs
          node scripts/validate_runtime_bundles.mjs
          node scripts/validate_live_condition_contract.mjs
          npm --prefix pct-hike-viz run test
          npm --prefix pct-hike-viz run lint

      - name: Build
        working-directory: pct-hike-viz
        run: npm run build

      - name: SPA fallback (404.html)
        working-directory: pct-hike-viz
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pct-hike-viz/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
